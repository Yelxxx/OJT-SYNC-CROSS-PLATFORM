<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OJT Sync - Offline</title>

    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <style>
        :root {
            --font-sans: 'Figtree', sans-serif;
            --bg-cream-50: #FCFBF7;
            --bg-white: #FFFFFF;
            --text-gray-900: #101828;
            --text-gray-500: #6B7280;
            --primary-500: #33954B;
            --primary-600: #2E7D32;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-cream-50);
            color: var(--text-gray-900);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .offline-container {
            text-align: center;
            background-color: var(--bg-white);
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 100%;
        }

        .offline-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 1.5rem;
            color: var(--text-gray-500);
        }

        .offline-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-gray-900);
        }

        .offline-message {
            font-size: 1rem;
            color: var(--text-gray-500);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .offline-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.375rem;
            border-width: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-500);
            color: white;
            border-color: var(--primary-500);
        }

        .btn-primary:hover {
            background-color: var(--primary-600);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-500);
            border-color: var(--primary-500);
        }

        .btn-outline:hover {
            background-color: rgba(51, 149, 75, 0.05);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <svg class="offline-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-message">
            It looks like you've lost your internet connection. You can still use OJT Sync for basic functionality,
            but some features may be limited until you're back online.
        </p>
        <div class="offline-actions">
            <button class="btn btn-outline" onclick="window.location.reload()">
                Try Again
            </button>
            <a href="/" class="btn btn-primary">
                Go Home
            </a>
        </div>
    </div>
</body>
</html>
